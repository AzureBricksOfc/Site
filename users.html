<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - Azure Bricks</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/Site/Logo2.png">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="hamburger">☰</div>
                <a href="index.html">
                    <img src="assets/Site/Logo.png" alt="Azure Bricks" class="logo-img">
                </a>
                <ul class="nav-links">
                    <li><a href="games.html">Games</a></li>
                    <li><a href="#">Catalog</a></li>
                    <li><a href="#">Develop</a></li>
                    <li><a href="forum.html">Forum</a></li>
                </ul>
            </div>
            
            <div class="nav-middle">
                <div class="search-container">
                    <input type="text" placeholder="Search">
                </div>
            </div>

            <div class="nav-right" id="user-info">
                <a href="login.html">Login</a>
                <a href="login.html?mode=signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="games-layout">
            <div class="games-main" style="width: 100%;">
                <h2 style="margin-bottom: 20px; color: var(--text-color);">All Players</h2>
                <div id="users-container" style="display:flex; flex-direction:column; gap:10px;">
                    <p style="color:var(--text-muted);">Loading players...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
