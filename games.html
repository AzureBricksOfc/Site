<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Azure Bricks</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Imagens%20Do%20jogo/Site/Logo2.png">
</head>
<body>
    <!-- 2017 Style Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="hamburger">☰</div>
                <a href="index.html">
                    <img src="Imagens%20Do%20jogo/Site/Logo.png" alt="Azure Bricks" class="logo-img">
                </a>
                <ul class="nav-links">
                    <li><a href="games.html" class="active">Games</a></li>
                    <li><a href="#">Catalog</a></li>
                    <li><a href="#">Develop</a></li>
                    <li><a href="forum.html">Forum</a></li>
                </ul>
            </div>
            
            <div class="nav-middle">
                <div class="search-container">
                    <input type="text" placeholder="Search">
                </div>
            </div>

            <div class="nav-right" id="user-info">
                <!-- Fallback if JS isn't loaded yet -->
                <a href="login.html">Login</a>
                <a href="login.html?mode=signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        
        <div class="games-layout">
            
            <div class="games-main">
                <h3 style="margin-bottom: 10px; color: #333; font-weight: normal; font-size: 20px;">Recommended</h3>
                
                <div class="games-grid">
                    <p style="color: #666; font-style: italic; padding: 20px 0; grid-column: 1 / -1; text-align: center;">Nenhum jogo disponível no momento.</p>
                </div>
            </div>

            <!-- Right Sidebar for Ads -->
            <div class="sidebar-right">
                <div class="ad-placeholder">
                    ADVERTISEMENT - Why am I seeing ads?
                </div>
                <div class="ad-placeholder" style="height: 250px;">
                    ADVERTISEMENT - Report
                </div>
            </div>
            
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
