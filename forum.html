<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum - Azure Bricks</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/Site/Logo2.png">
    <style>
        .forum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--primary-blue);
            color: white;
            padding: 15px;
            border-radius: 4px 4px 0 0;
            margin-top: 20px;
        }

        .forum-header h3 { margin: 0; font-size: 18px; }

        .forum-list {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 4px 4px;
        }

        .forum-row {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .forum-row:last-child { border-bottom: none; }
        .forum-row:hover { background-color: rgba(0,0,0,0.02); }

        .forum-title { font-size: 16px; font-weight: 600; cursor: pointer; }
        .forum-title:hover { text-decoration: underline; }
        .forum-author { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .forum-replies { font-size: 13px; color: var(--text-muted); }

        /* Post View */
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 15px;
            display: flex;
            overflow: hidden;
        }

        .post-user {
            width: 150px;
            background-color: rgba(0,0,0,0.02);
            border-right: 1px solid var(--border-color);
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .post-user-avatar {
            width: 80px; height: 80px;
            background-color: #ddd;
            margin: 0 auto 10px;
            border-radius: 4px;
        }

        .post-content {
            padding: 15px;
            flex-grow: 1;
            white-space: pre-wrap;
        }

        .post-date {
            font-size: 11px; color: var(--text-muted);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .action-btn {
            background-color: #00B06F; color: white;
            border: none; padding: 8px 15px; border-radius: 3px;
            font-weight: 600; cursor: pointer;
        }
        .action-btn:hover { background-color: #009961; }

        .form-area {
            margin-top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .form-area input, .form-area textarea {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border: 1px solid #ccc; border-radius: 3px; font-family: inherit;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="hamburger">☰</div>
                <a href="index.html">
                    <img src="assets/Site/Logo.png" alt="Azure Bricks" class="logo-img">
                </a>
                <ul class="nav-links">
                    <li><a href="games.html">Games</a></li>
                    <li><a href="#">Catalog</a></li>
                    <li><a href="#">Develop</a></li>
                    <li><a href="forum.html" class="active">Forum</a></li>
                </ul>
            </div>
            
            <div class="nav-middle">
                <div class="search-container">
                    <input type="text" placeholder="Search">
                </div>
            </div>

            <div class="nav-right" id="user-info">
                <!-- Fallback if JS isn't loaded yet -->
            </div>
        </div>
    </nav>

    <main class="container">
        <h2>Azure Bricks Forums</h2>
        
        <div id="forum-container">
            <!-- Dynamic Content goes here -->
        </div>

    </main>

    <script src="scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderForumHome();
        });
    </script>
</body>
</html>
